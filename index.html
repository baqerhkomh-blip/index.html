    <header className="sticky top-0 z-40 bg-[#050a2e]/90 backdrop-blur border-b border-sky-400/20">
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div className="flex items-center gap-3"><Mark/><div><div className="font-extrabold tracking-wide">دوري أبطال البريمرزيج</div><div className="text-[11px] text-sky-300/80">مرحلة الدوري • الملحق • الأدوار الإقصائية</div></div></div>
        {admin?<button onClick={()=>auth.signOut()} className="text-xs px-3 py-2 rounded-lg bg-white/10 font-bold">خروج</button>:<button onClick={()=>setLogin(true)} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-sky-400/40 text-sky-300 font-bold"><Ic n="lock"/>الأدمن</button>}
      </div>
      <div className="max-w-6xl mx-auto px-4 flex gap-2 overflow-x-auto pb-3">{tabs.map(([k,l,i])=><button key={k} onClick={()=>setTab(k)} className={"flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap "+(tab===k?"bg-sky-400 text-[#050a2e]":"bg-white/5 text-sky-100 border border-white/10")}><Ic n={i}/>{l}</button>)}</div>
    </header>
    <main className="max-w-6xl mx-auto px-4 pt-5">
    {tab==="table"&&<div><div className="rounded-xl border border-sky-400/20 bg-[#08114a]/80 overflow-x-auto"><table className="w-full text-[13px]"><thead><tr className="text-sky-300/80 text-xs border-b border-white/10"><th className="p-2 text-right">#</th><th className="p-2 text-right">اللاعب</th><th>لعب</th><th>فاز</th><th>خسر</th><th>تعادل</th><th>له</th><th>عليه</th><th>الفرق</th><th>النقاط</th></tr></thead><tbody>
      {R.map((s,i)=><tr key={s.p.id} className={"border-b border-white/5 "+(s.p.out?"bg-rose-500/10":"")}><td className="p-2"><span className={"inline-flex w-6 h-6 rounded-full items-center justify-center text-xs font-extrabold "+(s.p.out?"bg-rose-500 text-white":zone(i))}>{i+1}</span></td>
        <td className="p-2"><div className="flex items-center gap-2"><Badge p={s.p} s={28}/><div><div className={"font-bold leading-tight "+(s.p.out?"text-rose-300":"")}>{s.p.name}{s.p.out&&<span className="mr-2 text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-500 text-white align-middle">تم إقصاؤه</span>}</div><div className="text-[11px] text-sky-300/70">{(CM[s.p.club]||CM.x)[1]}</div></div></div></td>
        <td className="text-center">{s.pl}</td><td className="text-center">{s.w}</td><td className="text-center">{s.l}</td><td className="text-center">{s.d}</td><td className="text-center">{s.gf}</td><td className="text-center">{s.ga}</td><td className="text-center" dir="ltr">{s.gd>0?"+"+s.gd:s.gd}</td><td className="text-center font-extrabold text-sky-300 text-base">{s.pts}</td></tr>)}
      </tbody></table></div>
      <div className="flex flex-wrap gap-4 mt-3 text-xs text-white/70">{[["bg-emerald-500","1-10 مباشرة إلى دور الـ 16"],["bg-amber-400","11-22 الملحق"],["bg-rose-500","23-24 خروج"]].map(([c,t])=><span key={t} className="flex items-center gap-1.5"><i className={"w-3 h-3 rounded-full "+c}/>{t}</span>)}</div></div>}

    {tab==="matches"&&<div className="space-y-4">
      <div className="flex gap-2 overflow-x-auto">{[1,2,3,4,5,6].map(k=><button key={k} onClick={()=>setR(k)} className={"px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap "+(r===k?"bg-sky-400 text-[#050a2e]":"bg-white/5 border border-white/10")}>الجولة {k}</button>)}</div>
      <div className="text-[11px] text-white/50">الفريق على اليسار هو المستضيف.</div>
      {!D.fx.length?<div className="text-center text-white/60 py-10">لم تُجرَ القرعة بعد.</div>:
      <div className="grid md:grid-cols-2 gap-3">{D.fx.filter(f=>f.r===r&&(D.rev.includes(f.h)||D.rev.includes(f.a))).map(f=>{const H=P(f.h),A=P(f.a);if(!H||!A)return null;
        return <div key={f.id} dir="ltr" className="flex items-center justify-between gap-2 rounded-xl border border-sky-400/20 bg-[#08114a]/80 p-3">
          <div className="flex-1 flex items-center gap-2 min-w-0"><Badge p={H}/><span className="truncate text-sm font-bold">{H.name}</span></div>
          {admin?<div className="flex items-center gap-1"><Box v={f.hs} on={v=>setFx(f.id,"hs",v)}/><span>:</span><Box v={f.as} on={v=>setFx(f.id,"as",v)}/></div>:<div className="font-extrabold text-lg px-2 text-sky-300">{has(f)?f.hs+" - "+f.as:"VS"}</div>}
          <div className="flex-1 flex items-center justify-end gap-2 min-w-0"><span className="truncate text-sm font-bold">{A.name}</span><Badge p={A}/></div></div>})}</div>}</div>}

    {tab==="po"&&<div><div className="text-xs text-white/60 mb-3">المراكز 11-22 حسب الترتيب الحالي. صاحب المركز الأفضل يستضيف الإياب. اضغط على أي مواجهة لعرض أو إدخال النتيجة.</div><div className="grid grid-cols-2 sm:grid-cols-3 gap-6 justify-items-center">{po.map(t=><div key={t.id} className="text-center"><div className="text-[11px] text-sky-300 mb-1">{t.title}</div>{mini(t)}</div>)}</div></div>}

    {tab==="ko"&&<div className="overflow-x-auto pb-4"><div dir="ltr" className="flex items-stretch gap-6 min-w-max py-2">
      {col(r16.slice(0,4),"l")}{col(qf.slice(0,2),"l")}{col([sf[0]],"l")}
      <div className="flex flex-col items-center justify-center gap-2"><Ic n="cup" c="w-10 h-10 text-sky-300"/><div className="text-xs font-bold text-sky-300">النهائي</div>{mini(fin)}{fin.w&&<div className="flex items-center gap-2 mt-2 text-sm font-extrabold"><Badge p={fin.w} s={26}/>{fin.w.name}</div>}</div>
      {col([sf[1]],"r")}{col(qf.slice(2),"r")}{col(r16.slice(4),"r")}</div></div>}

    {tab==="draw"&&<div className="max-w-xl mx-auto space-y-4">
      <div className="rounded-2xl border border-sky-400/30 bg-[#08114a]/80 p-5 text-center space-y-3">
        <div className="text-xs text-sky-300">تمت قرعة {D.rev.length} من {D.players.length}</div>
        {!D.fx.length&&<div className="text-white/70 text-sm py-4">لم تبدأ القرعة بعد.</div>}
        {cur&&<div className="flex flex-col items-center gap-2 py-2"><Badge p={cur} s={84}/><div className="text-xl font-extrabold">{cur.name}</div><div className="text-sm text-sky-300">{(CM[cur.club]||CM.x)[1]}</div><div className="text-xs text-white/60">بانتظار قرعة المواجهات</div></div>}
        {!cur&&shown&&<div className="space-y-3"><div className="flex items-center justify-center gap-3"><Badge p={shown} s={52}/><div className="text-right"><div className="font-extrabold">{shown.name}</div><div className="text-xs text-sky-300">{(CM[shown.club]||CM.x)[1]}</div></div></div>
          <div className="space-y-1.5">{opp(shown.id).map(f=>{const home=f.h===shown.id,o=P(home?f.a:f.h);return o&&<div key={f.id} className="flex items-center gap-2 rounded-lg bg-white/5 px-3 py-2 text-sm"><span className="text-[11px] text-sky-300 w-14 text-right">الجولة {f.r}</span><Badge p={o} s={22}/><span className="flex-1 text-right font-bold">{o.name}</span><span className={"text-[11px] px-2 py-0.5 rounded-full "+(home?"bg-emerald-500/20 text-emerald-300":"bg-white/10 text-white/60")}>{home?"على أرضه":"خارج أرضه"}</span></div>})}</div></div>}
        {admin&&<div className="flex flex-col gap-2 pt-2">
          {!D.fx.length?<button onClick={startDraw} className="py-3 rounded-lg bg-sky-400 text-[#050a2e] font-extrabold">بدء القرعة</button>:
          cur?<button onClick={reveal} className="py-3 rounded-lg bg-emerald-400 text-emerald-950 font-extrabold">إجراء قرعة المواجهات</button>:
          <button onClick={pick} disabled={D.rev.length>=D.players.length} className="py-3 rounded-lg bg-sky-400 text-[#050a2e] font-extrabold disabled:opacity-40">سحب نادٍ</button>}</div>}</div>
      {D.rev.length>0&&<div className="flex flex-wrap gap-2 justify-center"><div className="w-full text-center text-[11px] text-white/50">اضغط على اسم أي لاعب لعرض خصومه</div>{D.rev.map(id=>{const p=P(id);return p&&<button key={id} onClick={()=>setSel(id)} className={"flex items-center gap-1.5 text-xs rounded-full pl-3 pr-1 py-1 "+(shown&&shown.id===id?"bg-sky-400 text-[#050a2e] font-bold":"bg-white/5")}><Badge p={p} s={20}/>{p.name}</button>})}</div>}</div>}

    {tab==="adm"&&admin&&<div className="space-y-4">
      <div className="rounded-xl border border-sky-400/20 bg-[#08114a]/80 p-4 text-sm flex flex-wrap gap-4 items-center justify-between"><div>اللاعبون: <b>{D.players.length}</b> / 24 &nbsp;|&nbsp; المستويات: {[1,2,3].map(k=><span key={k} className="ml-2">م{k}: <b>{D.players.filter(p=>p.pot===k).length}</b>/8</span>)} &nbsp; بلا مستوى: <b>{D.players.filter(p=>!p.pot).length}</b></div>
        <div className="flex gap-2"><button onClick={()=>setCf("r")} className="px-3 py-2 rounded-lg bg-amber-400/20 text-amber-300 text-xs font-bold">تصفير النتائج</button><button onClick={()=>setCf("d")} className="px-3 py-2 rounded-lg bg-rose-500/20 text-rose-300 text-xs font-bold">إعادة ضبط القرعة</button></div></div>
      <div className="grid gap-3 md:grid-cols-2">{D.players.map(p=><div key={p.id} className={"rounded-xl border bg-[#08114a]/80 p-3 space-y-2 "+(p.out?"border-rose-500/60":"border-white/10")}>
        <div className="flex items-center gap-2"><Badge p={p} s={34}/><input key={p.id+"n"} defaultValue={p.name} onBlur={e=>upd(p.id,"name",e.target.value)} className={inp}/><button onClick={()=>del(p.id)} className="px-3 py-2 rounded-lg bg-rose-500/20 text-rose-300 text-xs font-bold">حذف</button></div>
        <div className="grid grid-cols-2 gap-2"><select value={p.club} onChange={e=>upd(p.id,"club",e.target.value)} className={inp}>{CL.map(c=><option key={c[0]} value={c[0]}>{c[1]}</option>)}</select>
          <select value={p.pot} onChange={e=>upd(p.id,"pot",+e.target.value)} className={inp}><option value={0}>المستوى: غير محدد</option>{[1,2,3].map(k=><option key={k} value={k}>المستوى {k}</option>)}</select></div>
        <button onClick={()=>{if(p.out||confirm("إقصاء "+p.name+" من البطولة؟ سيُنقل إلى أسفل الترتيب."))upd(p.id,"out",!p.out)}} className={"w-full py-2 rounded-lg text-xs font-bold "+(p.out?"bg-emerald-500/20 text-emerald-300":"bg-rose-500/20 text-rose-300")}>{p.out?"إلغاء الإقصاء":"إقصاء من البطولة"}</button>
        <input key={p.id+"l"} dir="ltr" defaultValue={p.logo} placeholder="رابط شعار مخصص (اختياري)" onBlur={e=>upd(p.id,"logo",e.target.value.trim())} className={inp}/></div>)}</div>
      <div className="flex gap-2"><input value={np} onChange={e=>setNp(e.target.value)} placeholder="اسم لاعب جديد" className={inp}/><button onClick={()=>{if(!np.trim())return;save({...D,players:[...D.players,{id:"p"+Date.now(),name:np.trim(),club:"x",logo:"",pot:0}]});setNp("")}} className="px-4 rounded-lg bg-sky-400 text-[#050a2e] font-extrabold text-sm whitespace-nowrap">إضافة</button></div></div>}
    </main>
    {open&&ties[open]&&<Modal t={ties[open]} admin={admin} set={setTie} close={()=>setOpen(null)}/>}
    {cf&&<div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4"><form onSubmit={doConf} className="bg-[#0a1445] border border-rose-400/40 p-6 rounded-2xl w-full max-w-sm space-y-3"><div className="font-extrabold text-center">{cf==="r"?"تصفير النتائج":"إعادة ضبط القرعة"}</div>
      <p className="text-xs text-center text-white/70">{cf==="r"?"سيتم مسح كل نتائج المباريات والأدوار الإقصائية مع إبقاء القرعة.":"سيتم مسح القرعة والنتائج بالكامل."} أدخل كلمة المرور للتأكيد.</p>
      <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="كلمة المرور" dir="ltr" autoFocus className="w-full p-3 rounded-lg bg-[#050a2e] border border-rose-400/40 text-center"/>
      {er2&&<p className="text-rose-400 text-xs text-center font-bold">{er2}</p>}
      <div className="flex gap-2"><button type="submit" className="flex-1 bg-rose-500 font-extrabold py-2.5 rounded-lg">تأكيد</button><button type="button" onClick={()=>{setCf(null);setPw2("");setEr2("")}} className="flex-1 bg-white/10 py-2.5 rounded-lg font-bold">إلغاء</button></div></form></div>}
    {login&&<div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4"><form onSubmit={doLogin} className="bg-[#0a1445] border border-sky-400/40 p-6 rounded-2xl w-full max-w-sm space-y-3"><div className="font-extrabold text-center">دخول الأدمن</div>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="كلمة المرور" dir="ltr" autoFocus className="w-full p-3 rounded-lg bg-[#050a2e] border border-sky-400/40 text-center"/>
      {err&&<p className="text-rose-400 text-xs text-center font-bold">{err}</p>}
      <div className="flex gap-2"><button type="submit" className="flex-1 bg-sky-400 text-[#050a2e] font-extrabold py-2.5 rounded-lg">دخول</button><button type="button" onClick={()=>{setLogin(false);setErr("")}} className="flex-1 bg-white/10 py-2.5 rounded-lg font-bold">إلغاء</button></div></form></div>}
  </div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>بطولة اليورو للمشاركين</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style id="m">:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}html,body{background:#062c43;margin:0;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}input[type=number]{-moz-appearance:textfield}</style>
</head><body><div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel">
const {useState,useMemo,useEffect}=React;
const FB={apiKey:"AIzaSyCY10A5oXDiTkwSlfjLzgJkytiGJP29QNg",authDomain:"euro-baqer.firebaseapp.com",projectId:"euro-baqer",appId:"1:586459203467:web:0c54f96ad1fd657575918e"};
firebase.initializeApp(FB);const db=firebase.firestore(),auth=firebase.auth();
const RG={
A:[["مصطفى مزاحم","النمسا","🇦🇹"],["يوسف حسن","النرويج","🇳🇴"],["هاشم","كرواتيا","🇭🇷"],["مشعان","البوسنة والهرسك","🇧🇦"]],
B:[["باقر","فرنسا","🇫🇷"],["رضا","الدنمارك","🇩🇰"],["أمير","ألبانيا","🇦🇱"],["هترو","بولندا","🇵🇱"]],
C:[["محمد","المجر","🇭🇺"],["فينوم","هولندا","🇳🇱"],["ابن وحيد","سويسرا","🇨🇭"],["محمود","روسيا","🇷🇺"]],
D:[["عباس","تركيا","🇹🇷"],["زيد","أيرلندا","🇮🇪"],["ماثيو","جبل طارق","🇬🇮"],["لوسيفر","جورجيا","🇬🇪"]],
E:[["مصطفى كربلاء","إنجلترا","🏴󠁧󠁢󠁥󠁮󠁧󠁿"],["قديس","إسبانيا","🇪🇸"],["أحمد","بلجيكا","🇧🇪"],["سابو","إيطاليا","🇮🇹"]],
F:[["كوفن","ألمانيا","🇩🇪"],["محمد باسم","ويلز","🏴󠁧󠁢󠁷󠁬󠁳󠁿"],["علي","البرتغال","🇵🇹"],["ياتو","إسكتلندا","🏴󠁧󠁢󠁳󠁣󠁴󠁿"]]};
const GROUPS=Object.fromEntries(Object.entries(RG).map(([g,a])=>[g,a.map((t,i)=>({id:g+(i+1),player:t[0],country:t[1],flag:t[2]}))]));
const PAIRS=[[0,1],[2,3],[0,2],[1,3],[3,0],[1,2]];
const MATCHES=[];
Object.keys(GROUPS).forEach(g=>PAIRS.forEach((p,i)=>MATCHES.push({id:g+"_"+i,group:g,round:Math.floor(i/2)+1,home:GROUPS[g][p[0]],away:GROUPS[g][p[1]]})));
const cmp=(a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf;
const has=sc=>sc&&sc.home!==""&&sc.away!==""&&sc.home!==undefined&&sc.away!==undefined;
const num=v=>v===""?"":Math.max(0,parseInt(v,10)||0);

function Team({t,sm}){return <div className="flex items-center gap-2"><span className={sm?"text-xl":"text-2xl"}>{t.flag}</span><div><div className="font-bold leading-tight text-sm">{t.player}</div><div className="text-[11px] text-cyan-300/80">{t.country}</div></div></div>}
function Box({v,on}){return <input type="number" min="0" value={v} onChange={e=>on(e.target.value)} placeholder="-" className="w-11 h-10 text-center bg-slate-900 text-white font-extrabold rounded-xl border border-cyan-400"/>}

function KO({m,sc,admin,on,fin}){
  return <div className={"rounded-2xl p-3 border "+(fin?"border-amber-400 border-2 bg-[#0b3b54]":"border-cyan-500/30 bg-[#073349]")}>
    <div className="text-xs font-bold text-cyan-300 mb-2 text-center">{m.title}</div>
    {["home","away"].map(side=>{const t=m[side];return <div key={side} className="flex items-center justify-between gap-2 bg-[#041f30]/70 p-2 rounded-xl mb-2">
      {t?<Team t={t} sm/>:<span className="text-xs text-slate-400 italic">بانتظار المتأهل...</span>}
      {admin&&t?<input type="number" min="0" value={sc[side]} onChange={e=>on(m.id,side,e.target.value)} placeholder="-" className="w-10 h-8 text-center bg-slate-900 text-amber-300 font-bold rounded-lg border border-cyan-500/50"/>:<span className="font-extrabold text-amber-300 px-2">{sc[side]!==""&&sc[side]!==undefined?sc[side]:"-"}</span>}
    </div>})}
  </div>}

function App(){
  const [tab,setTab]=useState("groups"),[round,setRound]=useState(1),[gf,setGf]=useState("ALL");
  const [s,setS]=useState({}),[k,setK]=useState({});
  const [user,setUser]=useState(null),[admin,setAdmin]=useState(false),[login,setLogin]=useState(false),[em,setEm]=useState(""),[pw,setPw]=useState(""),[err,setErr]=useState("");
  const ref=db.collection("tournament").doc("main");
  useEffect(()=>{
    const u1=ref.onSnapshot(d=>{const v=d.data()||{};setS(v.s||{});setK(v.k||{})});
    const u2=auth.onAuthStateChanged(u=>{setUser(u);if(!u)setAdmin(false)});
    return()=>{u1();u2()}},[]);
  const save=(a,b)=>ref.set({s:a,k:b}).catch(()=>alert("تعذّر الحفظ، تأكد من تسجيل الدخول بحساب الأدمن"));
  const setScore=(id,side,v)=>{const n={...s,[id]:{...(s[id]||{home:"",away:""}),[side]:num(v)}};setS(n);save(n,k)};
  const setKo=(id,side,v)=>{const n={...k,[id]:{...(k[id]||{home:"",away:""}),[side]:num(v)}};setK(n);save(s,n)};
  const reset=()=>{if(confirm("مسح جميع النتائج؟")){setS({});setK({});save({},{})}};
  const doLogin=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(em,pw);setLogin(false);setAdmin(true);setErr("");setPw("")}catch(x){setErr("البريد أو كلمة المرور غير صحيحة")}};

  const standings=useMemo(()=>{
    const r={};
    Object.keys(GROUPS).forEach(g=>{
      const st={};GROUPS[g].forEach(t=>st[t.id]={...t,group:g,played:0,gf:0,ga:0,gd:0,pts:0});
      MATCHES.filter(m=>m.group===g).forEach(m=>{const sc=s[m.id];if(!has(sc))return;
        const h=+sc.home,a=+sc.away,H=st[m.home.id],A=st[m.away.id];
        H.played++;A.played++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;H.gd=H.gf-H.ga;A.gd=A.gf-A.ga;
        if(h>a)H.pts+=3;else if(a>h)A.pts+=3;else{H.pts++;A.pts++}});
      r[g]=Object.values(st).sort(cmp)});
    return r},[s]);
  const thirds=useMemo(()=>Object.keys(standings).map(g=>standings[g][2]).sort(cmp),[standings]);
  const br=useMemo(()=>{
    const T=thirds.slice(0,4),S=standings;
    const r16=[["B0",T[0]],["A0","C1"],["F0",T[1]],["D1","E1"],["E0",T[2]],["D0","F1"],["C0",T[3]],["A1","B1"]].map((p,i)=>{
      const f=x=>typeof x==="string"?S[x[0]][+x[1]]:x;
      return {id:"R16_"+(i+1),title:"ثمن النهائي "+(i+1),home:f(p[0]),away:f(p[1])}});
    const win=m=>{const sc=k[m.id];if(!has(sc)||!m.home||!m.away)return null;return +sc.away>+sc.home?m.away:m.home};
    const mk=(id,t,a,b)=>({id,title:t,home:win(a),away:win(b)});
    const qf=[0,1,2,3].map(i=>mk("QF_"+(i+1),"ربع النهائي "+(i+1),r16[2*i],r16[2*i+1]));
    const sf=[0,1].map(i=>mk("SF_"+(i+1),"نصف النهائي "+(i+1),qf[2*i],qf[2*i+1]));
    const fin=mk("FINAL","النهائي الكبير 🏆",sf[0],sf[1]);
    return {r16,qf,sf,fin,champ:win(fin)}},[standings,thirds,k]);

  const tabs=[["groups","👥 المجموعات"],["matches","📅 المباريات"],["thirds","🥉 الثوالث"],["knockout","🏆 الإقصائيات"]];
  const koGrid=(arr)=><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">{arr.map(m=><KO key={m.id} m={m} sc={k[m.id]||{home:"",away:""}} admin={admin} on={setKo}/>)}</div>;
  const th="text-cyan-300/80 text-xs py-2";

  return <div className="min-h-screen pb-16" style={{background:"linear-gradient(135deg,#062c43,#054569,#0a6c74)"}}>
    <header className="border-b border-cyan-500/30 bg-[#041f30]/90 sticky top-0 z-40">
      <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div><h1 className="text-xl font-extrabold text-amber-300">🏆 بطولة اليورو للمشاركين</h1><p className="text-xs text-cyan-300/80">24 مشاركاً • 6 مجموعات</p></div>
        <div className="flex gap-2 flex-wrap">
          {user?<>
            <button onClick={()=>setAdmin(!admin)} className="bg-slate-800 text-cyan-300 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs font-bold">{admin?"🔓 إنهاء التعديل":"🔒 تعديل النتائج"}</button>
            {admin&&<button onClick={reset} className="bg-rose-500/20 text-rose-300 border border-rose-500/40 px-3 py-2 rounded-xl text-xs font-bold">تصفير</button>}
            <button onClick={()=>auth.signOut()} className="bg-slate-800 text-slate-300 px-3 py-2 rounded-xl text-xs font-bold">خروج</button>
          </>:<button onClick={()=>setLogin(true)} className="bg-slate-800 text-cyan-300 border border-cyan-500/30 px-3 py-2 rounded-xl text-xs font-bold">🔐 دخول الأدمن</button>}
        </div>
      </div>
      <div className="max-w-6xl mx-auto px-4 flex gap-2 overflow-x-auto pb-3">
        {tabs.map(t=><button key={t[0]} onClick={()=>setTab(t[0])} className={"px-4 py-2 rounded-xl font-bold text-sm whitespace-nowrap "+(tab===t[0]?"bg-cyan-400 text-slate-950":"bg-slate-900/60 text-cyan-100 border border-cyan-500/20")}>{t[1]}</button>)}
      </div>
    </header>
    {admin&&<div className="bg-amber-500/20 text-amber-200 px-4 py-2 text-center text-xs font-bold">وضع التعديل: كل نتيجة تُحفظ فوراً وتظهر للجميع.</div>}
    <main className="max-w-6xl mx-auto px-4 pt-6">
      {tab==="groups"&&<div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        {Object.keys(standings).map(g=><div key={g} className="bg-[#073349] border-2 border-amber-400/70 rounded-2xl overflow-hidden">
          <div className="bg-[#042030] py-3 px-4 font-extrabold">المجموعة {g}</div>
          <div className="p-3 overflow-x-auto"><table className="w-full text-sm"><thead><tr className={th}><th className="text-right">#</th><th className="text-right">المشارك</th><th>لعب</th><th>فارق</th><th>نقاط</th></tr></thead><tbody>
            {standings[g].map((t,i)=><tr key={t.id} className={i<2?"bg-emerald-500/10":i===2?"bg-amber-500/5":""}>
              <td className="py-2 font-bold">{i+1}</td><td className="py-2"><Team t={t} sm/></td>
              <td className="text-center">{t.played}</td><td className="text-center" dir="ltr">{t.gd>0?"+"+t.gd:t.gd}</td><td className="text-center font-extrabold text-amber-300 text-base">{t.pts}</td></tr>)}
          </tbody></table></div></div>)}
      </div>}

      {tab==="matches"&&<div className="space-y-5">
        <div className="bg-[#042030] p-3 rounded-2xl border border-cyan-500/30 flex flex-wrap gap-3 justify-between">
          <div className="flex gap-2">{[1,2,3].map(r=><button key={r} onClick={()=>setRound(r)} className={"px-4 py-2 rounded-xl font-bold text-sm "+(round===r?"bg-amber-400 text-slate-950":"bg-slate-800 text-cyan-200")}>الجولة {r}</button>)}</div>
          <div className="flex gap-1.5 flex-wrap">{["ALL","A","B","C","D","E","F"].map(g=><button key={g} onClick={()=>setGf(g)} className={"px-3 py-1.5 rounded-lg text-xs font-bold "+(gf===g?"bg-cyan-400 text-slate-950":"bg-slate-800 text-slate-300")}>{g==="ALL"?"الكل":g}</button>)}</div>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {MATCHES.filter(m=>m.round===round&&(gf==="ALL"||m.group===gf)).map(m=>{const sc=s[m.id]||{home:"",away:""};
            return <div key={m.id} className="bg-[#073349] border border-cyan-500/30 rounded-2xl p-3 flex items-center justify-between gap-2">
              <div className="flex-1"><Team t={m.home}/></div>
              <div className="flex flex-col items-center"><span className="text-[10px] text-amber-300 mb-1 font-bold">مجموعة {m.group}</span>
                {admin?<div className="flex items-center gap-1" dir="ltr"><Box v={sc.away} on={v=>setScore(m.id,"away",v)}/><span>:</span><Box v={sc.home} on={v=>setScore(m.id,"home",v)}/></div>
                :<div className="px-3 py-1.5 bg-[#041f30] rounded-xl font-extrabold text-lg text-amber-300" dir="ltr">{has(sc)?sc.away+" - "+sc.home:"VS"}</div>}
              </div>
              <div className="flex-1 flex justify-end"><Team t={m.away}/></div>
            </div>})}
        </div></div>}

      {tab==="thirds"&&<div className="bg-[#073349] border-2 border-amber-400/70 rounded-2xl max-w-3xl mx-auto overflow-hidden">
        <div className="bg-[#042030] p-4"><h2 className="font-extrabold text-amber-300">أصحاب المركز الثالث (يتأهل أفضل 4)</h2><p className="text-xs text-cyan-200 mt-1">الترتيب: النقاط ثم فارق الأهداف ثم الأهداف المسجلة.</p></div>
        <div className="p-3 overflow-x-auto"><table className="w-full text-sm"><thead><tr className={th}><th className="text-right">#</th><th>المجموعة</th><th className="text-right">المشارك</th><th>فارق</th><th>نقاط</th><th>الحالة</th></tr></thead><tbody>
          {thirds.map((t,i)=><tr key={t.id} className={i<4?"bg-emerald-500/15":"opacity-60"}>
            <td className="py-2 font-bold">{i+1}</td><td className="text-center text-amber-300 font-bold">{t.group}</td><td className="py-2"><Team t={t} sm/></td>
            <td className="text-center" dir="ltr">{t.gd>0?"+"+t.gd:t.gd}</td><td className="text-center font-extrabold text-amber-300">{t.pts}</td>
            <td className="text-center text-xs">{i<4?"متأهل ✓":"خارج"}</td></tr>)}
        </tbody></table></div></div>}

      {tab==="knockout"&&<div className="space-y-7">
        {br.champ&&<div className="border-2 border-amber-400 rounded-3xl p-5 text-center max-w-xl mx-auto bg-amber-500/20">
          <div className="text-4xl">🏆</div><div className="text-xs font-bold text-amber-200">بطل يورو المشاركين</div>
          <div className="text-3xl font-extrabold mt-1">{br.champ.flag} {br.champ.player}</div><div className="text-sm text-amber-300">{br.champ.country}</div></div>}
        <div><h3 className="text-lg font-extrabold text-amber-300 mb-3">دور الـ 16</h3>{koGrid(br.r16)}</div>
        <div><h3 className="text-lg font-extrabold text-cyan-300 mb-3">ربع النهائي</h3>{koGrid(br.qf)}</div>
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div className="lg:col-span-2"><h3 className="text-lg font-extrabold text-emerald-300 mb-3">نصف النهائي</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{br.sf.map(m=><KO key={m.id} m={m} sc={k[m.id]||{home:"",away:""}} admin={admin} on={setKo}/>)}</div></div>
          <div><h3 className="text-lg font-extrabold text-amber-400 mb-3">النهائي 🏆</h3><KO m={br.fin} sc={k.FINAL||{home:"",away:""}} admin={admin} on={setKo} fin/></div>
        </div></div>}
    </main>{login&&<div className="fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4"><form onSubmit={doLogin} className="bg-[#06293d] border-2 border-cyan-500/40 p-6 rounded-2xl w-full max-w-sm space-y-3">
    <h3 className="text-xl font-extrabold text-center">🔐 دخول مشرف البطولة</h3>
    <input type="email" value={em} onChange={e=>setEm(e.target.value)} placeholder="البريد الإلكتروني" dir="ltr" className="w-full p-3 rounded-xl bg-slate-900 border border-cyan-500/50 text-center"/>
    <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="كلمة المرور" dir="ltr" className="w-full p-3 rounded-xl bg-slate-900 border border-cyan-500/50 text-center"/>
    {err&&<p className="text-rose-400 text-xs text-center font-bold">{err}</p>}
    <div className="flex gap-2"><button type="submit" className="flex-1 bg-cyan-400 text-slate-950 font-extrabold py-2.5 rounded-xl">دخول</button><button type="button" onClick={()=>{setLogin(false);setErr("")}} className="flex-1 bg-slate-800 py-2.5 rounded-xl font-bold">إلغاء</button></div>
  </form></div>}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
